server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "public, max-age=300" always;
    error_page 404 /404.html;
    location = /healthz {
        default_type application/json;
        access_log off;
        add_header Cache-Control no-store;
    }
    location = /discord-updates.json {
        add_header Cache-Control no-store;
    }
    location = /discord/invite {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $discord_backend mabimoba-discord:8081;
        proxy_pass http://$discord_backend/invite;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /discord-unavailable;
    }
    location = /discord-unavailable {
        internal;
        default_type text/plain;
        return 503 "Discordボットの接続を確認できません。時間を置いてお試しください。";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
