services:
  discord:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: mabimoba-discord:${MABIMOBA_REVISION:?MABIMOBA_REVISIONを指定してください}
    container_name: mabimoba-discord
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?1Passwordから op run で渡す（deploy/bot.py）}
    volumes:
      - ${HOME}/.local/state/mabimoba/discord:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - public-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  public-web:
    external: true
    name: license-server_default
