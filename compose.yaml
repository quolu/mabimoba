services:
  web:
    build: .
    image: mabimoba:${MABIMOBA_REVISION:?MABIMOBA_REVISIONを指定してください}
    container_name: mabimoba-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      # ボットのUNIXソケットがあるフォルダ（認証仲介の run が作る）。nginxが /discord/invite・/discord/stats をここへ中継する。
      - type: bind
        source: /home/kite/BellTeam/runtime/data/shared/tools/auth-mediation/run-sockets/mabimoba-bot
        target: /run/mabimoba-bot
        read_only: true
        bind:
          create_host_path: false
    networks:
      - public-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  public-web:
    external: true
    name: license-server_default
