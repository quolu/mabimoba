services:
  web:
    build: .
    image: mabimoba:${MABIMOBA_REVISION:?MABIMOBA_REVISIONを指定してください}
    container_name: mabimoba-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - public-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  public-web:
    external: true
    name: license-server_default
